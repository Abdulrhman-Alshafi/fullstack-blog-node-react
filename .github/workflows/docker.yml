name: Docker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # Needed to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      OWNER_LOWER: ${{ lower(github.repository_owner) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform support, optional)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp-backend:latest
            ghcr.io/${{ env.OWNER_LOWER }}/fullstack-blog-node-react-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp-frontend:latest
            ghcr.io/${{ env.OWNER_LOWER }}/fullstack-blog-node-react-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  test-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      OWNER_LOWER: ${{ lower(github.repository_owner) }}

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports: [27017:27017]
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull backend image & run tests
        run: |
          docker pull ghcr.io/${{ env.OWNER_LOWER }}/fullstack-blog-node-react-backend:latest
          docker run --network host \
            -e MONGO_URL=mongodb://root:password@localhost:27017 \
            -e REDIS_URL=redis://localhost:6379 \
            ghcr.io/${{ env.OWNER_LOWER }}/fullstack-blog-node-react-backend:latest \
            npm test
