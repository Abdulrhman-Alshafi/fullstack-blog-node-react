name: Docker CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required to push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────── BACKEND ──────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp-backend:latest
            ghcr.io/abdulrhman-alshafi/fullstack-blog-node-react-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ────────────────────── FRONTEND ──────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp-frontend:latest
            ghcr.io/abdulrhman-alshafi/fullstack-blog-node-react-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports: [27017:27017]
        options: --health-cmd="mongosh --eval 'db.runCommand({ping: 1})'" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Run backend tests
        run: |
          docker run --network host \
            -e MONGO_URL=mongodb://root:password@localhost:27017 \
            -e REDIS_URL=redis://localhost:6379 \
            ghcr.io/abdulrhman-alshafi/fullstack-blog-node-react-backend:latest \
            npm test