version: "3.9"

services:
  backend:
    build: ./backend
    container_name: blog-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      

  frontend:
    build: ./frontend
    container_name: blog-frontend
    ports:
      - "3000:3000"
    environment:
      # Make React talk to backend inside Docker network
      REACT_APP_API_URL: http://backend:5000
    depends_on:
      - backend
